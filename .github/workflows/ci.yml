name: CI - API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: '${{ matrix.node-version }}'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run Cucumber tests with Allure
      run: npx @cucumber/cucumber tests/features/**/*.feature --require tests/support/index.ts --format json:tests/report/cucumber-report.json --format progress --format "allure-tape:test-results"

    - name: Archive test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cucumber-report-${{ matrix.node-version }}
        path: |
          tests/report/cucumber-report.json
          allure-results
          allure-results/allure-report
        retention-days: 30